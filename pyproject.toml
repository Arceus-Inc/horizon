[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "horizon"
version = "0.1.0"
description = "The strategy SDK that decides the sprint — direction, intake, and back-pressure over chorus."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Arceus-Inc" }]
keywords = ["strategy", "okr", "direction", "sdk", "chorus", "dream"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Typing :: Typed",
]
dependencies = [
  # horizon binds ONLY to dream.contracts (the cross-repo Protocol seam). It never imports chorus —
  # a consumer's composition root wires chorus's concrete classes into horizon's ports (spec: no
  # sideways import). Requires dream with the horizon ports in dream.contracts.
  "dream",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
horizon = "horizon_cli.__main__:main"

[project.urls]
Homepage   = "https://github.com/Arceus-Inc/horizon"
Repository = "https://github.com/Arceus-Inc/horizon"

# dream is a sibling repo; during local development install it editable. A consumer that runs the
# horizon<->chorus loop also installs chorus editable (only the composition root imports both):
#   uv pip install -e ../dream -e ../chorus -e .[dev]
[tool.uv.sources]
dream = { path = "../dream", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/horizon", "src/horizon_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/horizon", "src/horizon_cli", "tests", "docs", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["horizon", "horizon_cli"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
